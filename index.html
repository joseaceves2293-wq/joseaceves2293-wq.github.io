<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C0E">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket">
  <meta name="description" content="Pocket — a tiny app that works offline.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Pocket</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="112" fill="#C6F432"/>
        <path fill="#0B0C0E" d="M166 168c0-16 16-28 50-28h80c34 0 50 12 50 28v154c0 52-36 86-90 86s-90-34-90-86V168z"/>
        <path fill="none" stroke="#C6F432" stroke-width="18" stroke-linecap="round" d="M196 206c20 16 40 22 60 22s40-6 60-22"/>
      </svg>
    </div>
    <h1>Pocket</h1>
    <p class="status" id="status">Running in browser <b>Add to Home Screen</b></p>
    <div class="pill" id="net" role="status"><span class="dot"></span><span class="label">Online</span></div>
    <button type="button" class="tap" id="tap"><span>Tap</span><span class="count" id="count">0</span></button>
  </main>
  <script src="./app.js"></script>
</body>
</html>
