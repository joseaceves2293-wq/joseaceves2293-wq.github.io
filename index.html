<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting…</title><meta http-equiv="refresh" content="0; url=./stinger/">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(new URL(r.scope).pathname==='/')r.unregister()}))}location.replace('./stinger/')</script>
</head><body><a href="./stinger/">Open Stinger</a></body></html>
